<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Classic Companion — ChatGPT, a shortcut away on your Mac.</title>
  <desc id="desc">A MacTokyo app. Warm ivory typography on charcoal with a vermilion accent and the Option Space keyboard shortcut.</desc>
  <rect width="1200" height="360" rx="16" fill="#1B1917"/>
  <text x="60" y="65" fill="#BBB5AC" font-family="Helvetica, sans-serif" font-size="15" letter-spacing="3">MACTOKYO · INDEPENDENT APPS</text>
  <text x="56" y="154" fill="#FAF9F6" font-family="Georgia, serif" font-size="65">Classic Companion<tspan fill="#B5341F">.</tspan></text>
  <text x="60" y="213" fill="#FAF9F6" font-family="Helvetica, sans-serif" font-size="25">ChatGPT, a shortcut away on your Mac.</text>
  <path d="M60 275H760" stroke="#49433C"/>
  <text x="60" y="316" fill="#BBB5AC" font-family="Helvetica, sans-serif" font-size="15">NATIVE macOS WINDOW</text>
  <text x="647" y="316" fill="#BBB5AC" font-family="Helvetica, sans-serif" font-size="15">PUBLIC BETA</text>
